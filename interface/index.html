<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversor de Arquivos</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0f0f0f;
        --surface: #1a1a1a;
        --surface-2: #222;
        --border: #2d2d2d;
        --text: #e8e8e8;
        --text-muted: #999;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --success: #10b981;
        --error: #ef4444;
    }

    html, body { height: 100%; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background:
            radial-gradient(ellipse 900px 560px at 50% 32%, rgba(59,130,246,.10), transparent 65%),
            var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .tela {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        overflow-y: auto;
    }

    .app { max-width: 680px; width: 100%; }

    h1 {
        font-size: 26px;
        line-height: 1.2;
        text-align: center;
        margin-bottom: 24px;
        letter-spacing: -.5px;
    }

    .rodape-marca {
        flex-shrink: 0;
        text-align: center;
        padding: 14px;
        font-size: 13px;
        letter-spacing: 1px;
        color: var(--text-muted);
        opacity: .5;
    }

    .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 5px;
        margin-bottom: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
    }

    .tab {
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--text-muted);
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }
    .tab:hover { color: var(--text); }
    .tab.ativa { color: #fff; background: var(--surface-2); }

    .passo {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 12px;
    }
    .passo.desabilitado { opacity: .55; }

    .passo-titulo {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        margin-bottom: 13px;
    }

    .passo-num {
        display: inline-grid;
        place-items: center;
        width: 21px;
        height: 21px;
        border-radius: 50%;
        background: rgba(59,130,246,.14);
        color: #8ab4ff;
        font-size: 11px;
    }

    .btn-entrada {
        width: 100%;
        padding: 13px 14px;
        background: var(--surface-2);
        border: 1px dashed #3a3a3a;
        border-radius: 8px;
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-entrada:hover { border-color: var(--accent); }
    .drop-hint { margin-top: 8px; color: var(--text-muted); font-size: 10px; text-align: center; }
    #conteudo.arrastando .passo:first-child {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59,130,246,.10);
    }

    .arquivo-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
    }
    .arquivo-info > div { min-width: 0; }
    .arquivo-info-nome {
        font-size: 13px;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .arquivo-info-meta { margin-top: 2px; color: var(--text-muted); font-size: 11px; }

    .btn-trocar {
        flex: 0 0 auto;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        font-size: 11px;
        cursor: pointer;
    }
    .btn-trocar:hover { color: var(--text); border-color: #444; }

    .sugestao-troca {
        margin-top: 12px;
        padding: 10px 11px;
        border-radius: 7px;
        background: rgba(59,130,246,.08);
        color: var(--text-muted);
        font-size: 11px;
    }
    .sugestao-troca a { color: #75a7ff; cursor: pointer; text-decoration: none; }
    .sugestao-troca a:hover { text-decoration: underline; }

    .placeholder-saida { color: var(--text-muted); font-size: 12px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 8px 11px;
        background: var(--surface-2);
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.ativo { border-color: var(--accent); background: rgba(59,130,246,.12); }
    .chip.secundario { color: #b8c8e4; }
    .chip.secundario.ativo { border-color: var(--accent); background: rgba(59,130,246,.12); }

    .painel-param {
        margin-top: 12px;
        border-top: 1px solid var(--border);
        padding-top: 13px;
    }
    .campo { display: grid; gap: 6px; margin-bottom: 10px; }
    .campo label, .checkbox-row label { font-size: 11px; color: var(--text-muted); }
    .campo-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .campo input[type="number"] {
        width: 100%;
        background: #131313;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        padding: 8px 9px;
        outline: none;
    }
    .campo input[type="number"]:focus { border-color: var(--accent); }
    .campo input[type="range"] { width: 100%; accent-color: var(--accent); }
    .campo select {
        width: 100%;
        background: #131313;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        padding: 8px 9px;
        outline: none;
    }
    .campo select:focus { border-color: var(--accent); }

    .checkbox-row {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 3px 0 11px;
    }
    .checkbox-row input { accent-color: var(--accent); }

    .btn-executar {
        width: 100%;
        padding: 10px;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-executar:hover { background: var(--accent-hover); }
    .btn-executar:disabled { opacity: .5; cursor: default; }

    .resultado {
        border-radius: 10px;
        padding: 16px 18px;
        margin-top: 14px;
        border-left: 4px solid var(--success);
        background: var(--surface);
    }
    .resultado.erro { border-left-color: var(--error); }
    .resultado-titulo { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .resultado.erro .resultado-titulo { color: var(--error); }
    .resultado:not(.erro) .resultado-titulo { color: var(--success); }
    .resultado-detalhe { font-size: 12px; color: var(--text-muted); word-break: break-all; margin-bottom: 12px; }
    .resultado-acoes { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-mini {
        padding: 7px 12px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
    }
    .btn-mini:hover { border-color: var(--accent); }
    .btn-mini.principal { background: var(--accent); border-color: var(--accent); }

    .carregando {
        margin-top: 14px;
        padding: 12px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        color: var(--text-muted);
    }

    .arquivos-resumo { min-width: 0; flex: 1; }
    .arquivos-preview { margin-top: 10px; display: grid; gap: 5px; }
    .arquivo-preview {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--text-muted);
        font-size: 11px;
    }
    .arquivo-preview span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mais-arquivos { color: #75a7ff; font-size: 11px; margin-top: 6px; }

    .config-lote { display: grid; gap: 10px; margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--border); }
    .pasta-row { display: flex; align-items: center; gap: 8px; }
    .pasta-atual {
        min-width: 0;
        flex: 1;
        padding: 8px 9px;
        border-radius: 6px;
        background: #131313;
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .fila { margin-top: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .fila-topo { display: flex; justify-content: space-between; gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--border); }
    .fila-topo strong { font-size: 13px; }
    .fila-topo span { color: var(--text-muted); font-size: 11px; }
    .fila-lista { max-height: 300px; overflow-y: auto; }
    .fila-item { padding: 10px 15px; border-bottom: 1px solid rgba(45,45,45,.7); }
    .fila-item:last-child { border-bottom: 0; }
    .fila-linha { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .fila-nome { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .fila-status { flex: 0 0 auto; color: var(--text-muted); font-size: 11px; }
    .fila-item.concluido .fila-status { color: var(--success); }
    .fila-item.erro .fila-status { color: var(--error); }
    .fila-item.ignorado .fila-status { color: #f59e0b; }
    .fila-erro { color: var(--error); font-size: 10px; margin-top: 4px; word-break: break-word; }
    .progresso { height: 3px; margin-top: 7px; border-radius: 2px; overflow: hidden; background: #111; }
    .progresso > span { display: block; height: 100%; background: var(--accent); transition: width .2s ease; }
    .processando .progresso > span { width: 38%; animation: progresso-indeterminado 1.1s ease-in-out infinite; }
    @keyframes progresso-indeterminado { from { transform: translateX(-110%); } to { transform: translateX(270%); } }
    .fila-acoes { display: flex; gap: 8px; padding: 12px 15px; border-top: 1px solid var(--border); flex-wrap: wrap; }

    .link-conversoes {
        display: block;
        width: 100%;
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 12px;
        padding: 12px 0 4px;
        cursor: pointer;
        text-align: center;
    }
    .link-conversoes:hover { color: var(--accent); }

    .painel-conversoes {
        margin-top: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 11px;
        color: var(--text-muted);
    }
    .painel-conversoes.oculto { display: none; }
    .grupo-conversoes + .grupo-conversoes { margin-top: 13px; }
    .grupo-conversoes h4 { color: var(--text); font-size: 11px; margin-bottom: 6px; }
    .linha-conversao { padding: 3px 0; }
    .linha-conversao b { color: #c6d1e5; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    @media (max-width: 520px) {
        .tela { padding: 24px 14px; align-items: flex-start; }
        .campo-row { grid-template-columns: 1fr; gap: 0; }
    }


    .cabecalho-app {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        margin-bottom: 24px;
    }
    .cabecalho-app h1 { margin-bottom: 0; padding: 0 52px; }

    .btn-config {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface);
        color: var(--text-muted);
        font-size: 18px;
        cursor: pointer;
    }
    .btn-config:hover { color: var(--text); border-color: #444; background: var(--surface-2); }

    .modal-config {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(0, 0, 0, .62);
        backdrop-filter: blur(4px);
    }
    .modal-config.oculto { display: none; }

    .config-card {
        width: min(390px, 100%);
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #171717;
        box-shadow: 0 24px 80px rgba(0,0,0,.42);
        padding: 18px;
    }
    .config-topo {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
    }
    .config-topo h2 { font-size: 17px; margin-bottom: 3px; }
    .config-subtitulo { color: var(--text-muted); font-size: 11px; }
    .btn-fechar-config {
        width: 30px;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
    }
    .btn-fechar-config:hover { color: var(--text); background: var(--surface-2); }

    .config-label {
        display: block;
        margin-bottom: 9px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
    }
    .idiomas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .idioma-btn {
        display: grid;
        gap: 2px;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--text);
        text-align: left;
        cursor: pointer;
    }
    .idioma-btn:hover { border-color: #4a4a4a; }
    .idioma-btn.ativo { border-color: var(--accent); background: rgba(59,130,246,.12); }
    .idioma-btn strong { font-size: 12px; }
    .idioma-btn span { color: var(--text-muted); font-size: 10px; }

</style>
</head>
<body>
<div class="tela">
    <div class="app">
        <div class="cabecalho-app">
            <h1 id="appTitle">Conversor de Arquivos</h1>
            <button class="btn-config" id="btnConfig" type="button" onclick="abrirConfiguracoes()" aria-label="Configurações" title="Configurações">⚙</button>
        </div>

        <div class="tabs">
            <button class="tab ativa" id="tabArquivo" onclick="trocarAba('arquivo')">📄 Arquivos</button>
            <button class="tab" id="tabImagem" onclick="trocarAba('imagem')">🖼️ Imagens</button>
        </div>

        <div id="conteudo"></div>

        <button class="link-conversoes" id="linkConversoes" onclick="toggleConversoes()">Ver todas as conversões disponíveis</button>
        <div class="painel-conversoes oculto" id="painelConversoes"></div>
    </div>
</div>

<div class="modal-config oculto" id="modalConfig" role="dialog" aria-modal="true" aria-labelledby="configTitulo">
    <div class="config-card">
        <div class="config-topo">
            <div>
                <h2 id="configTitulo">Configurações</h2>
                <div class="config-subtitulo" id="configSubtitulo">Personalize o aplicativo.</div>
            </div>
            <button class="btn-fechar-config" id="btnFecharConfig" type="button" onclick="fecharConfiguracoes()" aria-label="Fechar configurações">×</button>
        </div>

        <span class="config-label" id="configIdiomaLabel">Idioma</span>
        <div class="idiomas">
            <button class="idioma-btn" id="idiomaPt" type="button" onclick="definirIdioma('pt')">
                <strong id="idiomaPtNome">Português</strong>
                <span id="idiomaPtSub">Português (Brasil)</span>
            </button>
            <button class="idioma-btn" id="idiomaEn" type="button" onclick="definirIdioma('en')">
                <strong id="idiomaEnNome">English</strong>
                <span id="idiomaEnSub">English</span>
            </button>
        </div>
    </div>
</div>

<footer class="rodape-marca">© ink-creator</footer>

        besideOriginals: 'Beside the original files',
        chooseFolder: 'Choose folder',
        conflict: 'If a file exists',
        rename: 'Rename',
        overwrite: 'Overwrite',
        skip: 'Skip',
        startQueue: 'Start conversion',
        convertAllTo: format => `Convert all to ${format.toUpperCase()}`,
        queue: 'Conversion queue',
        waiting: 'waiting',
        converting: 'converting…',
        completed: '✓ completed',
        skipped: '— skipped',
        failed: '✗ error',
        queueProgress: (done, total) => `${done} of ${total}`,
        queueSummary: (ok, skipped, failed) => `${ok} completed · ${skipped} skipped · ${failed} failed`,
        chooseOperation: 'Choose a conversion or image tool to configure the batch.',
        convertImages: 'Convert images',
        compressAll: 'Compress all',
        resizeAll: 'Resize all',
    },
};

function lerIdiomaSalvo() {
    try {
        const saved = localStorage.getItem(STORAGE_LANGUAGE);
        return saved === 'en' ? 'en' : 'pt';
    } catch (_) {
        return 'pt';
    }
}

let idiomaAtivo = lerIdiomaSalvo();
let abaAtiva = 'arquivo';

function novoEstado() {
    return {
        entradas: [],
        infos: [],
        operacao: null,
        destinoPasta: null,
        politica: 'renomear',
        qualidade: 85,
        largura: '',
        altura: '',
        manterProporcoes: true,
        fila: [],
        executando: false,
        finalizado: false,
    };
}

const estado = {
    arquivo: novoEstado(),
    imagem: novoEstado(),
};

function t(key, ...args) {
    const value = I18N[idiomaAtivo][key];
    return typeof value === 'function' ? value(...args) : value;
}

function escapeHtml(value) {
    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

function salvarIdioma(language) {
    try { localStorage.setItem(STORAGE_LANGUAGE, language); } catch (_) {}
}

async function carregarIdiomaBackend() {
    try {
        if (window.pywebview?.api?.get_language) {
            const response = await window.pywebview.api.get_language();
            if (response?.language === 'en' || response?.language === 'pt') {
                idiomaAtivo = response.language;
                salvarIdioma(idiomaAtivo);
                aplicarIdioma();
            }
        }
    } catch (_) {}
}

async function sincronizarIdiomaBackend() {
    try {
        if (window.pywebview?.api?.set_language) {
            await window.pywebview.api.set_language(idiomaAtivo);
        }
    } catch (_) {}
}

function aplicarIdioma() {
    document.documentElement.lang = idiomaAtivo === 'en' ? 'en' : 'pt-BR';
    document.title = t('pageTitle');
    document.getElementById('appTitle').textContent = t('appTitle');
    document.getElementById('btnConfig').title = t('settings');
    document.getElementById('btnConfig').setAttribute('aria-label', t('settings'));
    document.getElementById('configTitulo').textContent = t('settings');
    document.getElementById('configSubtitulo').textContent = t('settingsSubtitle');
    document.getElementById('configIdiomaLabel').textContent = t('language');
    document.getElementById('btnFecharConfig').title = t('closeSettings');
    document.getElementById('btnFecharConfig').setAttribute('aria-label', t('closeSettings'));
    document.getElementById('idiomaPtNome').textContent = t('portuguese');
    document.getElementById('idiomaPtSub').textContent = t('portugueseNative');
    document.getElementById('idiomaEnNome').textContent = t('english');
    document.getElementById('idiomaEnSub').textContent = t('englishNative');
    document.getElementById('tabArquivo').textContent = `📄 ${t('files')}`;
    document.getElementById('tabImagem').textContent = `🖼️ ${t('images')}`;
    document.getElementById('idiomaPt').classList.toggle('ativo', idiomaAtivo === 'pt');
    document.getElementById('idiomaEn').classList.toggle('ativo', idiomaAtivo === 'en');

    const painel = document.getElementById('painelConversoes');
    const aberto = !painel.classList.contains('oculto');
    document.getElementById('linkConversoes').textContent = aberto ? t('hideConversions') : t('showConversions');
    painel.innerHTML = construirPainelConversoes();
    render();
}

async function definirIdioma(language) {
    idiomaAtivo = language === 'en' ? 'en' : 'pt';
    salvarIdioma(idiomaAtivo);
    aplicarIdioma();
    await sincronizarIdiomaBackend();
}

function abrirConfiguracoes() {
    document.getElementById('modalConfig').classList.remove('oculto');
}

function fecharConfiguracoes() {
    document.getElementById('modalConfig').classList.add('oculto');
}

function normalizaExt(ext) {
    if (ext === 'htm') return 'html';
    if (ext === 'yml') return 'yaml';
    return ext;
}

function nomeMetodo(origem, destino) {
    return `converter_${normalizaExt(origem)}_${normalizaExt(destino)}`;
}

function extensao(caminho) {
    const m = caminho.match(/\.([a-zA-Z0-9]+)$/);
    return m ? m[1].toLowerCase() : '';
}

function nomeArquivo(caminho) {
    return caminho.split(/[\\/]/).pop();
}

function caminhoCodificado(caminho) {
    return encodeURIComponent(String(caminho)).replaceAll("'", '%27');
}

function trocarAba(aba) {
    abaAtiva = aba;
    document.getElementById('tabArquivo').classList.toggle('ativa', aba === 'arquivo');
    document.getElementById('tabImagem').classList.toggle('ativa', aba === 'imagem');
    render();
}

function trocarComEntradas(aba, entradas, infos) {
    estado[aba] = novoEstado();
    estado[aba].entradas = [...entradas];
    estado[aba].infos = [...infos];
    trocarAba(aba);
}

function resetar(aba) {
    estado[aba] = novoEstado();
    render();
}

async function selecionarEntrada(aba) {
    if (estado[aba].executando) return;
    await sincronizarIdiomaBackend();
    const caminhos = await window.pywebview.api.selecionar_arquivos(aba);
    if (!caminhos || !caminhos.length) return;

    const infos = await window.pywebview.api.obter_info_arquivos(caminhos);
    const anterior = estado[aba];
    estado[aba] = novoEstado();
    estado[aba].entradas = caminhos;
    estado[aba].infos = infos || [];
    estado[aba].politica = anterior.politica;
    render();
}

async function receberArquivosSoltos(caminhos) {
    const aba = abaAtiva;
    if (estado[aba].executando || !Array.isArray(caminhos) || !caminhos.length) return;
    const infos = await window.pywebview.api.obter_info_arquivos(caminhos);
    const anterior = estado[aba];
    estado[aba] = novoEstado();
    estado[aba].entradas = caminhos;
    estado[aba].infos = infos || [];
    estado[aba].politica = anterior.politica;
    render();
}

async function selecionarPasta(aba) {
    const pasta = await window.pywebview.api.selecionar_pasta();
    if (!pasta) return;
    estado[aba].destinoPasta = pasta;
    render();
}

function selecionarOperacao(aba, tipo, destino = null) {
    const s = estado[aba];
    if (s.executando) return;
    s.operacao = { tipo, destino };
    s.fila = [];
    s.finalizado = false;
    render();
}

function atualizarOpcao(aba, chave, valor) {
    estado[aba][chave] = valor;
}

async function executarFila(aba) {
    const s = estado[aba];
    if (!s.operacao || s.executando) return;
    if (s.operacao.tipo === 'redimensionar' && (!s.largura || !s.altura)) return;

    const operacao = {
        ...s.operacao,
        qualidade: Number(s.qualidade),
        largura: s.largura ? Number(s.largura) : null,
        altura: s.altura ? Number(s.altura) : null,
        manter_proporcoes: s.manterProporcoes,
    };
    s.fila = s.entradas.map(arquivo => ({
        arquivo,
        estado: 'aguardando',
        progresso: 0,
        resultado: null,
    }));
    s.executando = true;
    s.finalizado = false;
    render();

    await sincronizarIdiomaBackend();
    for (const item of s.fila) {
        item.estado = 'processando';
        item.progresso = null;
        render();
        try {
            const resposta = await window.pywebview.api.converter_item_lote(
                item.arquivo, operacao, s.destinoPasta, s.politica
            );
            item.resultado = resposta;
            item.progresso = 100;
            if (!resposta?.sucesso) item.estado = 'erro';
            else if (resposta.ignorado) item.estado = 'ignorado';
            else item.estado = 'concluido';
        } catch (e) {
            item.estado = 'erro';
            item.progresso = 100;
            item.resultado = { sucesso: false, erro: String(e) };
        }
        render();
    }
    s.executando = false;
    s.finalizado = true;
    render();
}

async function abrirArquivo(caminho) {
    await window.pywebview.api.abrir_arquivo(caminho);
}

async function abrirPasta(caminho) {
    await window.pywebview.api.abrir_pasta(caminho);
}

function fmtKB(bytes) {
    const value = Number(bytes || 0) / 1024;
    return new Intl.NumberFormat(idiomaAtivo === 'en' ? 'en-US' : 'pt-BR', {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1,
    }).format(value) + ' KB';
}

function render() {
    document.getElementById('conteudo').innerHTML =
        abaAtiva === 'arquivo' ? renderTela('arquivo') : renderTela('imagem');
}

function renderTela(aba) {
    const s = estado[aba];
    const outraAba = aba === 'arquivo' ? 'imagem' : 'arquivo';
    let html = '';

    html += `<div class="passo">
        <div class="passo-titulo"><span class="passo-num">1</span> ${t('input')}</div>`;

    if (!s.entradas.length) {
        html += `<button class="btn-entrada" onclick="selecionarEntrada('${aba}')">
            ${aba === 'arquivo' ? t('selectFile') : t('selectImage')}
        </button><div class="drop-hint">${t('dropHint')}</div>`;
    } else {
        html += `<div class="arquivo-info">
            <div class="arquivos-resumo">
                <div class="arquivo-info-nome">${t('selectedCount', s.entradas.length)}</div>
                <div class="arquivo-info-meta">${fmtKB(s.infos.reduce((total, info) => total + Number(info?.tamanho || 0), 0))}</div>
            </div>
            <button class="btn-trocar" onclick="selecionarEntrada('${aba}')">${t('change')}</button>
        </div>`;

        html += `<div class="arquivos-preview">${s.entradas.slice(0, 3).map((arquivo, index) => `
            <div class="arquivo-preview"><span>${escapeHtml(nomeArquivo(arquivo))}</span><span>${escapeHtml(s.infos[index]?.tamanho_formatado || '')}</span></div>
        `).join('')}</div>`;
        if (s.entradas.length > 3) html += `<div class="mais-arquivos">+${s.entradas.length - 3}</div>`;

        const extensoes = s.entradas.map(extensao);
        const todosOutraAba = extensoes.every(ext => outraAba === 'imagem' ? FORMATOS_IMAGEM.includes(ext) : !!MAPA_ARQUIVO[normalizaExt(ext)]);
        const todosAba = extensoes.every(ext => aba === 'imagem' ? FORMATOS_IMAGEM.includes(ext) : !!MAPA_ARQUIVO[normalizaExt(ext)]);
        if (!todosAba && todosOutraAba) {
            const frase = outraAba === 'imagem' ? t('looksLikeImage') : t('looksLikeFile');
            const link = outraAba === 'imagem' ? t('switchImages') : t('switchFiles');
            html += `<div class="sugestao-troca">
                ${frase}
                <a onclick="trocarComEntradas('${outraAba}', estado['${aba}'].entradas, estado['${aba}'].infos)">${link}</a>
            </div>`;
        }
    }
    html += `</div>`;

    html += `<div class="passo ${!s.entradas.length ? 'desabilitado' : ''}">
        <div class="passo-titulo"><span class="passo-num">2</span> ${t('output')}</div>
        ${aba === 'arquivo' ? renderSaidaArquivo(s) : renderSaidaImagem(s)}
    </div>`;

    if (s.fila.length) html += renderFila(aba, s);

    return html;
}

function renderSaidaArquivo(s) {
    if (!s.entradas.length) return `<div class="placeholder-saida">${t('selectInputFileFirst')}</div>`;
    const conjuntos = s.entradas.map(arquivo => MAPA_ARQUIVO[normalizaExt(extensao(arquivo))] || []);
    const destinos = conjuntos[0].filter(destino => conjuntos.every(lista => lista.includes(destino)));
    if (!destinos.length) return `<div class="placeholder-saida">${t('noCommonConversion')}</div>`;
    let html = `<div class="chips">
        ${destinos.map(d => `<button class="chip ${s.operacao?.destino === d ? 'ativo' : ''}" onclick="selecionarOperacao('arquivo', 'converter', '${d}')">→ ${d.toUpperCase()}</button>`).join('')}
    </div>`;
    if (s.operacao) html += renderConfigLote('arquivo', s);
    return html;
}

function renderSaidaImagem(s) {
    if (!s.entradas.length) return `<div class="placeholder-saida">${t('selectInputImageFirst')}</div>`;
    const extensoes = s.entradas.map(extensao);
    if (!extensoes.every(ext => FORMATOS_IMAGEM.includes(ext))) return `<div class="placeholder-saida">${t('noCommonConversion')}</div>`;

    let html = `<div class="chips">`;
    FORMATOS_IMAGEM.filter(f => !extensoes.every(ext => ext === f)).forEach(f => {
        html += `<button class="chip ${s.operacao?.tipo === 'converter' && s.operacao?.destino === f ? 'ativo' : ''}" onclick="selecionarOperacao('imagem', 'converter', '${f}')">→ ${f.toUpperCase()}</button>`;
    });
    html += `<button class="chip secundario ${s.operacao?.tipo === 'comprimir' ? 'ativo' : ''}" onclick="selecionarOperacao('imagem', 'comprimir')">${t('compress')}</button>`;
    html += `<button class="chip secundario ${s.operacao?.tipo === 'redimensionar' ? 'ativo' : ''}" onclick="selecionarOperacao('imagem', 'redimensionar')">${t('resize')}</button>`;
    html += `</div>`;
    if (s.operacao) html += renderConfigLote('imagem', s);
    return html;
}

function renderConfigLote(aba, s) {
    let parametros = '';
    if ((s.operacao.tipo === 'converter' && aba === 'imagem') || s.operacao.tipo === 'comprimir') {
        parametros = `<div class="campo">
            <label>${t('quality')}: <span id="qualidadeValor">${s.qualidade}</span>%</label>
            <input type="range" min="1" max="100" value="${s.qualidade}" ${s.executando ? 'disabled' : ''}
                oninput="atualizarOpcao('${aba}', 'qualidade', Number(this.value)); document.getElementById('qualidadeValor').textContent = this.value">
        </div>`;
    } else if (s.operacao.tipo === 'redimensionar') {
        parametros = `<div class="campo-row">
            <div class="campo"><label>${t('width')}</label><input type="number" min="1" value="${escapeHtml(s.largura)}" placeholder="${t('exampleWidth')}" oninput="atualizarOpcao('${aba}', 'largura', this.value)" ${s.executando ? 'disabled' : ''}></div>
            <div class="campo"><label>${t('height')}</label><input type="number" min="1" value="${escapeHtml(s.altura)}" placeholder="${t('exampleHeight')}" oninput="atualizarOpcao('${aba}', 'altura', this.value)" ${s.executando ? 'disabled' : ''}></div>
        </div>
        <div class="checkbox-row"><input type="checkbox" id="inManterProp" ${s.manterProporcoes ? 'checked' : ''} onchange="atualizarOpcao('${aba}', 'manterProporcoes', this.checked)" ${s.executando ? 'disabled' : ''}> <label for="inManterProp">${t('keepAspect')}</label></div>`;
    }

    const titulo = s.operacao.tipo === 'converter'
        ? t('convertAllTo', s.operacao.destino)
        : (s.operacao.tipo === 'comprimir' ? t('compressAll') : t('resizeAll'));
    return `<div class="config-lote">
        <strong class="resultado-titulo">${titulo}</strong>
        ${parametros}
        <div class="campo">
            <label>${t('destinationFolder')}</label>
            <div class="pasta-row">
                <div class="pasta-atual" title="${escapeHtml(s.destinoPasta || '')}">${escapeHtml(s.destinoPasta || t('besideOriginals'))}</div>
                <button class="btn-mini" onclick="selecionarPasta('${aba}')" ${s.executando ? 'disabled' : ''}>${t('chooseFolder')}</button>
            </div>
        </div>
        <div class="campo">
            <label>${t('conflict')}</label>
            <select onchange="atualizarOpcao('${aba}', 'politica', this.value)" ${s.executando ? 'disabled' : ''}>
                <option value="renomear" ${s.politica === 'renomear' ? 'selected' : ''}>${t('rename')}</option>
                <option value="sobrescrever" ${s.politica === 'sobrescrever' ? 'selected' : ''}>${t('overwrite')}</option>
                <option value="ignorar" ${s.politica === 'ignorar' ? 'selected' : ''}>${t('skip')}</option>
            </select>
        </div>
        <button class="btn-executar" onclick="executarFila('${aba}')" ${s.executando ? 'disabled' : ''}>${t('startQueue')}</button>
    </div>`;
}

function renderFila(aba, s) {
    const concluidos = s.fila.filter(item => item.estado === 'concluido').length;
    const ignorados = s.fila.filter(item => item.estado === 'ignorado').length;
    const erros = s.fila.filter(item => item.estado === 'erro').length;
    const processados = concluidos + ignorados + erros;
    const rotulos = {
        aguardando: t('waiting'),
        processando: t('converting'),
        concluido: t('completed'),
        ignorado: t('skipped'),
        erro: t('failed'),
    };
    const itens = s.fila.map(item => `<div class="fila-item ${item.estado}">
        <div class="fila-linha">
            <span class="fila-nome" title="${escapeHtml(item.arquivo)}">${escapeHtml(nomeArquivo(item.arquivo))}</span>
            <span class="fila-status">${rotulos[item.estado]}</span>
        </div>
        <div class="progresso"><span style="width:${item.progresso === null ? 38 : item.progresso}%"></span></div>
        ${item.estado === 'erro' ? `<div class="fila-erro">${escapeHtml(item.resultado?.erro || t('unknownError'))}</div>` : ''}
    </div>`).join('');
    const primeiroResultado = s.fila.find(item => item.resultado?.arquivo && !item.resultado?.ignorado)?.resultado?.arquivo
        || s.fila.find(item => item.resultado?.arquivo)?.resultado?.arquivo;
    const acoes = s.finalizado ? `<div class="fila-acoes">
        ${primeiroResultado ? `<button class="btn-mini principal" onclick="abrirPasta(decodeURIComponent('${caminhoCodificado(primeiroResultado)}'))">${t('openFolder')}</button>` : ''}
        <button class="btn-mini" onclick="resetar('${aba}')">${t('newConversion')}</button>
    </div>` : '';
    return `<div class="fila">
        <div class="fila-topo"><strong>${t('queue')}</strong><span>${s.finalizado ? t('queueSummary', concluidos, ignorados, erros) : t('queueProgress', processados, s.fila.length)}</span></div>
        <div class="fila-lista">${itens}</div>
        ${acoes}
    </div>`;
}

function construirPainelConversoes() {
    const aliases = new Set(['htm', 'yml']);
    const linhasArquivo = Object.entries(MAPA_ARQUIVO)
        .filter(([origem]) => !aliases.has(origem))
        .map(([origem, destinos]) =>
            `<div class="linha-conversao"><b>${origem.toUpperCase()}</b> → ${destinos.map(d => d.toUpperCase()).join(', ')}</div>`
        ).join('');

    const linhaImagem = `<div class="linha-conversao"><b>${FORMATOS_IMAGEM.map(f => f.toUpperCase()).join(' / ')}</b> → ${t('imageConversions')}</div>`;

    return `
        <div class="grupo-conversoes"><h4>${t('documentsData')}</h4>${linhasArquivo}</div>
        <div class="grupo-conversoes"><h4>${t('imagesGroup')}</h4>${linhaImagem}</div>
    `;
}

function toggleConversoes() {
    const painel = document.getElementById('painelConversoes');
    const aberto = painel.classList.toggle('oculto') === false;
    document.getElementById('linkConversoes').textContent = aberto ? t('hideConversions') : t('showConversions');
}

document.getElementById('modalConfig').addEventListener('click', event => {
    if (event.target.id === 'modalConfig') fecharConfiguracoes();
});

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') fecharConfiguracoes();
});

const areaDrop = document.getElementById('conteudo');
['dragenter', 'dragover'].forEach(tipo => areaDrop.addEventListener(tipo, event => {
    event.preventDefault();
    areaDrop.classList.add('arrastando');
}));
['dragleave', 'drop'].forEach(tipo => areaDrop.addEventListener(tipo, event => {
    event.preventDefault();
    if (tipo === 'drop' || !areaDrop.contains(event.relatedTarget)) {
        areaDrop.classList.remove('arrastando');
    }
}));

window.addEventListener('pywebviewready', carregarIdiomaBackend);
aplicarIdioma();
</script>
</body>
</html>
