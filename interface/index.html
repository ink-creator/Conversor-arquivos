<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversor de Arquivos</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0f0f0f;
        --surface: #1a1a1a;
        --surface-2: #222;
        --border: #2d2d2d;
        --text: #e8e8e8;
        --text-muted: #999;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --success: #10b981;
        --error: #ef4444;
    }

    html, body { height: 100%; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background:
            radial-gradient(ellipse 900px 560px at 50% 32%, rgba(59,130,246,.10), transparent 65%),
            var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .tela {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        overflow-y: auto;
    }

    .app { max-width: 480px; width: 100%; }

    h1 {
        font-size: 26px;
        line-height: 1.2;
        text-align: center;
        margin-bottom: 24px;
        letter-spacing: -.5px;
    }

    .rodape-marca {
        flex-shrink: 0;
        text-align: center;
        padding: 14px;
        font-size: 13px;
        letter-spacing: 1px;
        color: var(--text-muted);
        opacity: .5;
    }

    .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 5px;
        margin-bottom: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
    }

    .tab {
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--text-muted);
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }
    .tab:hover { color: var(--text); }
    .tab.ativa { color: #fff; background: var(--surface-2); }

    .passo {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 12px;
    }
    .passo.desabilitado { opacity: .55; }

    .passo-titulo {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        margin-bottom: 13px;
    }

    .passo-num {
        display: inline-grid;
        place-items: center;
        width: 21px;
        height: 21px;
        border-radius: 50%;
        background: rgba(59,130,246,.14);
        color: #8ab4ff;
        font-size: 11px;
    }

    .btn-entrada {
        width: 100%;
        padding: 13px 14px;
        background: var(--surface-2);
        border: 1px dashed #3a3a3a;
        border-radius: 8px;
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-entrada:hover { border-color: var(--accent); }

    .arquivo-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
    }
    .arquivo-info > div { min-width: 0; }
    .arquivo-info-nome {
        font-size: 13px;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .arquivo-info-meta { margin-top: 2px; color: var(--text-muted); font-size: 11px; }

    .btn-trocar {
        flex: 0 0 auto;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        font-size: 11px;
        cursor: pointer;
    }
    .btn-trocar:hover { color: var(--text); border-color: #444; }

    .sugestao-troca {
        margin-top: 12px;
        padding: 10px 11px;
        border-radius: 7px;
        background: rgba(59,130,246,.08);
        color: var(--text-muted);
        font-size: 11px;
    }
    .sugestao-troca a { color: #75a7ff; cursor: pointer; text-decoration: none; }
    .sugestao-troca a:hover { text-decoration: underline; }

    .placeholder-saida { color: var(--text-muted); font-size: 12px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 8px 11px;
        background: var(--surface-2);
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.secundario { color: #b8c8e4; }
    .chip.secundario.ativo { border-color: var(--accent); background: rgba(59,130,246,.12); }

    .painel-param {
        margin-top: 12px;
        border-top: 1px solid var(--border);
        padding-top: 13px;
    }
    .campo { display: grid; gap: 6px; margin-bottom: 10px; }
    .campo label, .checkbox-row label { font-size: 11px; color: var(--text-muted); }
    .campo-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .campo input[type="number"] {
        width: 100%;
        background: #131313;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        padding: 8px 9px;
        outline: none;
    }
    .campo input[type="number"]:focus { border-color: var(--accent); }
    .campo input[type="range"] { width: 100%; accent-color: var(--accent); }

    .checkbox-row {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 3px 0 11px;
    }
    .checkbox-row input { accent-color: var(--accent); }

    .btn-executar {
        width: 100%;
        padding: 10px;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-executar:hover { background: var(--accent-hover); }
    .btn-executar:disabled { opacity: .5; cursor: default; }

    .resultado {
        border-radius: 10px;
        padding: 16px 18px;
        margin-top: 14px;
        border-left: 4px solid var(--success);
        background: var(--surface);
    }
    .resultado.erro { border-left-color: var(--error); }
    .resultado-titulo { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .resultado.erro .resultado-titulo { color: var(--error); }
    .resultado:not(.erro) .resultado-titulo { color: var(--success); }
    .resultado-detalhe { font-size: 12px; color: var(--text-muted); word-break: break-all; margin-bottom: 12px; }
    .resultado-acoes { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-mini {
        padding: 7px 12px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
    }
    .btn-mini:hover { border-color: var(--accent); }
    .btn-mini.principal { background: var(--accent); border-color: var(--accent); }

    .carregando {
        margin-top: 14px;
        padding: 12px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        color: var(--text-muted);
    }

    .link-conversoes {
        display: block;
        width: 100%;
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 12px;
        padding: 12px 0 4px;
        cursor: pointer;
        text-align: center;
    }
    .link-conversoes:hover { color: var(--accent); }

    .painel-conversoes {
        margin-top: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 11px;
        color: var(--text-muted);
    }
    .painel-conversoes.oculto { display: none; }
    .grupo-conversoes + .grupo-conversoes { margin-top: 13px; }
    .grupo-conversoes h4 { color: var(--text); font-size: 11px; margin-bottom: 6px; }
    .linha-conversao { padding: 3px 0; }
    .linha-conversao b { color: #c6d1e5; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    @media (max-width: 520px) {
        .tela { padding: 24px 14px; align-items: flex-start; }
        .campo-row { grid-template-columns: 1fr; gap: 0; }
    }


    .cabecalho-app {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        margin-bottom: 24px;
    }
    .cabecalho-app h1 { margin-bottom: 0; padding: 0 52px; }

    .btn-config {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface);
        color: var(--text-muted);
        font-size: 18px;
        cursor: pointer;
    }
    .btn-config:hover { color: var(--text); border-color: #444; background: var(--surface-2); }

    .modal-config {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(0, 0, 0, .62);
        backdrop-filter: blur(4px);
    }
    .modal-config.oculto { display: none; }

    .config-card {
        width: min(390px, 100%);
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #171717;
        box-shadow: 0 24px 80px rgba(0,0,0,.42);
        padding: 18px;
    }
    .config-topo {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
    }
    .config-topo h2 { font-size: 17px; margin-bottom: 3px; }
    .config-subtitulo { color: var(--text-muted); font-size: 11px; }
    .btn-fechar-config {
        width: 30px;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
    }
    .btn-fechar-config:hover { color: var(--text); background: var(--surface-2); }

    .config-label {
        display: block;
        margin-bottom: 9px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
    }
    .idiomas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .idioma-btn {
        display: grid;
        gap: 2px;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--text);
        text-align: left;
        cursor: pointer;
    }
    .idioma-btn:hover { border-color: #4a4a4a; }
    .idioma-btn.ativo { border-color: var(--accent); background: rgba(59,130,246,.12); }
    .idioma-btn strong { font-size: 12px; }
    .idioma-btn span { color: var(--text-muted); font-size: 10px; }

</style>
</head>
<body>
<div class="tela">
    <div class="app">
        <div class="cabecalho-app">
            <h1 id="appTitle">Conversor de Arquivos</h1>
            <button class="btn-config" id="btnConfig" type="button" onclick="abrirConfiguracoes()" aria-label="Configurações" title="Configurações">⚙</button>
        </div>

        <div class="tabs">
            <button class="tab ativa" id="tabArquivo" onclick="trocarAba('arquivo')">📄 Arquivos</button>
            <button class="tab" id="tabImagem" onclick="trocarAba('imagem')">🖼️ Imagens</button>
        </div>

        <div id="conteudo"></div>

        <button class="link-conversoes" id="linkConversoes" onclick="toggleConversoes()">Ver todas as conversões disponíveis</button>
        <div class="painel-conversoes oculto" id="painelConversoes"></div>
    </div>
</div>

<div class="modal-config oculto" id="modalConfig" role="dialog" aria-modal="true" aria-labelledby="configTitulo">
    <div class="config-card">
        <div class="config-topo">
            <div>
                <h2 id="configTitulo">Configurações</h2>
                <div class="config-subtitulo" id="configSubtitulo">Personalize o aplicativo.</div>
            </div>
            <button class="btn-fechar-config" id="btnFecharConfig" type="button" onclick="fecharConfiguracoes()" aria-label="Fechar configurações">×</button>
        </div>

        <span class="config-label" id="configIdiomaLabel">Idioma</span>
        <div class="idiomas">
            <button class="idioma-btn" id="idiomaPt" type="button" onclick="definirIdioma('pt')">
                <strong id="idiomaPtNome">Português</strong>
                <span id="idiomaPtSub">Português (Brasil)</span>
            </button>
            <button class="idioma-btn" id="idiomaEn" type="button" onclick="definirIdioma('en')">
                <strong id="idiomaEnNome">English</strong>
                <span id="idiomaEnSub">English</span>
            </button>
        </div>
    </div>
</div>

<footer class="rodape-marca">© ink-creator</footer>

<script>
const MAPA_ARQUIVO = {
    txt:  ['pdf', 'docx'],
    pdf:  ['txt', 'docx'],
    docx: ['txt', 'pdf'],
    html: ['pdf', 'txt'],
    htm:  ['pdf', 'txt'],
    rtf:  ['txt'],
    csv:  ['json', 'xml', 'xlsx'],
    json: ['csv', 'xml', 'xlsx', 'yaml'],
    xml:  ['csv', 'json', 'yaml'],
    xlsx: ['csv', 'json'],
    yaml: ['json', 'xml'],
    yml:  ['json', 'xml'],
};
const FORMATOS_IMAGEM = ['png', 'jpg', 'jpeg', 'webp', 'bmp', 'gif'];
const STORAGE_LANGUAGE = 'fileConverter.language';

const I18N = {
    pt: {

        switchImages: 'Ir para a aba Imagens',
        switchFiles: 'Ir para a aba Arquivos',

        reduction: 'de redução',

        openFolder: 'Abrir pasta',

        unknownError: 'Erro desconhecido',
        tryAgain: 'Tentar novamente',
        selectInputFileFirst: 'Selecione primeiro um arquivo de entrada.',
        selectInputImageFirst: 'Selecione primeiro uma imagem de entrada.',
        formatNotSupported: ext => `O formato .${ext} não é suportado nesta aba.`,

        resize: 'Redimensionar',
        quality: 'Qualidade',
        compressImage: 'Comprimir imagem',
        width: 'Largura (px)',

        exampleHeight: 'ex.: 600',

        documentsData: 'Documentos e dados',

    },
    en: {
        pageTitle: 'File Converter',

        selectImage: '🖼️ Select image',
        change: 'Change',
        looksLikeImage: 'This file looks like an image.',
        looksLikeFile: 'This file looks like a document or data file.',
        switchImages: 'Switch to the Images tab',
        switchFiles: 'Switch to the Files tab',
        processing: 'Processing conversion…',
        conversionComplete: '✓ Conversion complete',
        reduction: 'reduction',
        openFile: 'Open file',
        openFolder: 'Open folder',
        newConversion: 'New conversion',
        error: '✗ Error',
        unknownError: 'Unknown error',
        tryAgain: 'Try again',
        selectInputFileFirst: 'Select an input file first.',
        selectInputImageFirst: 'Select an input image first.',
        formatNotSupported: ext => `Format .${ext} is not supported in this tab.`,

function lerIdiomaSalvo() {
    try {
        const saved = localStorage.getItem(STORAGE_LANGUAGE);
        return saved === 'en' ? 'en' : 'pt';
    } catch (_) {
        return 'pt';
    }
}

let idiomaAtivo = lerIdiomaSalvo();
let abaAtiva = 'arquivo';
const estado = {
    arquivo: { entrada: null, info: null, resultado: null, carregando: false },
    imagem:  { entrada: null, info: null, resultado: null, carregando: false, acao: null },
};

function t(key, ...args) {
    const value = I18N[idiomaAtivo][key];
    return typeof value === 'function' ? value(...args) : value;
}

function escapeHtml(value) {
    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

function salvarIdioma(language) {
    try { localStorage.setItem(STORAGE_LANGUAGE, language); } catch (_) {}
}

async function carregarIdiomaBackend() {
    try {
        if (window.pywebview?.api?.get_language) {
            const response = await window.pywebview.api.get_language();
            if (response?.language === 'en' || response?.language === 'pt') {
                idiomaAtivo = response.language;
                salvarIdioma(idiomaAtivo);
                aplicarIdioma();
            }
        }
    } catch (_) {}
}

async function sincronizarIdiomaBackend() {
    try {
        if (window.pywebview?.api?.set_language) {
            await window.pywebview.api.set_language(idiomaAtivo);
        }
    } catch (_) {}
}

function aplicarIdioma() {
    document.documentElement.lang = idiomaAtivo === 'en' ? 'en' : 'pt-BR';
    document.title = t('pageTitle');
    document.getElementById('appTitle').textContent = t('appTitle');
    document.getElementById('btnConfig').title = t('settings');
    document.getElementById('btnConfig').setAttribute('aria-label', t('settings'));
    document.getElementById('configTitulo').textContent = t('settings');
    document.getElementById('configSubtitulo').textContent = t('settingsSubtitle');
    document.getElementById('configIdiomaLabel').textContent = t('language');
    document.getElementById('btnFecharConfig').title = t('closeSettings');
    document.getElementById('btnFecharConfig').setAttribute('aria-label', t('closeSettings'));
    document.getElementById('idiomaPtNome').textContent = t('portuguese');
    document.getElementById('idiomaPtSub').textContent = t('portugueseNative');
    document.getElementById('idiomaEnNome').textContent = t('english');
    document.getElementById('idiomaEnSub').textContent = t('englishNative');
    document.getElementById('tabArquivo').textContent = `📄 ${t('files')}`;
    document.getElementById('tabImagem').textContent = `🖼️ ${t('images')}`;
    document.getElementById('idiomaPt').classList.toggle('ativo', idiomaAtivo === 'pt');
    document.getElementById('idiomaEn').classList.toggle('ativo', idiomaAtivo === 'en');

    const painel = document.getElementById('painelConversoes');
    const aberto = !painel.classList.contains('oculto');
    document.getElementById('linkConversoes').textContent = aberto ? t('hideConversions') : t('showConversions');
    painel.innerHTML = construirPainelConversoes();
    render();
}

async function definirIdioma(language) {
    idiomaAtivo = language === 'en' ? 'en' : 'pt';
    salvarIdioma(idiomaAtivo);
    aplicarIdioma();
    await sincronizarIdiomaBackend();
}

function abrirConfiguracoes() {
    document.getElementById('modalConfig').classList.remove('oculto');
}

function fecharConfiguracoes() {
    document.getElementById('modalConfig').classList.add('oculto');
}

function normalizaExt(ext) {
    if (ext === 'htm') return 'html';
    if (ext === 'yml') return 'yaml';
    return ext;
}

function nomeMetodo(origem, destino) {
    return `converter_${normalizaExt(origem)}_${normalizaExt(destino)}`;
}

function extensao(caminho) {
    const m = caminho.match(/\.([a-zA-Z0-9]+)$/);
    return m ? m[1].toLowerCase() : '';
}

function nomeArquivo(caminho) {
    return caminho.split(/[\\/]/).pop();
}

function trocarAba(aba) {
    abaAtiva = aba;
    document.getElementById('tabArquivo').classList.toggle('ativa', aba === 'arquivo');
    document.getElementById('tabImagem').classList.toggle('ativa', aba === 'imagem');
    render();
}

function trocarComEntrada(aba, caminho, info) {
    estado[aba].entrada = caminho;
    estado[aba].info = info;
    estado[aba].resultado = null;
    estado[aba].acao = null;
    trocarAba(aba);
}

function resetar(aba) {
    estado[aba] = { entrada: null, info: null, resultado: null, carregando: false, acao: null };
    render();
}

async function selecionarEntrada(aba) {
    await sincronizarIdiomaBackend();
    const caminho = await window.pywebview.api.selecionar_arquivo(aba);
    if (!caminho) return;

    const info = await window.pywebview.api.obter_info_arquivo(caminho);
    estado[aba].entrada = caminho;
    estado[aba].info = info;
    estado[aba].resultado = null;
    estado[aba].acao = null;
    render();
}

async function executarConversaoArquivo(destino) {
    const s = estado.arquivo;
    const origem = extensao(s.entrada);
    const metodo = nomeMetodo(origem, destino);
    s.carregando = true;
    s.resultado = null;
    render();
    try {
        await sincronizarIdiomaBackend();
        s.resultado = await window.pywebview.api[metodo](s.entrada);
    } catch (e) {
        s.resultado = { sucesso: false, erro: String(e) };
    }
    s.carregando = false;
    render();
}

async function executarConversaoImagem(formato) {
    const s = estado.imagem;
    s.carregando = true;
    s.resultado = null;
    render();
    try {
        await sincronizarIdiomaBackend();
        s.resultado = await window.pywebview.api.converter_imagem(s.entrada, formato);
    } catch (e) {
        s.resultado = { sucesso: false, erro: String(e) };
    }
    s.carregando = false;
    render();
}

async function executarCompressao() {
    const s = estado.imagem;
    const qualidade = document.getElementById('inQualidade').value;
    s.carregando = true;
    s.resultado = null;
    render();
    try {
        await sincronizarIdiomaBackend();
        s.resultado = await window.pywebview.api.comprimir_imagem(s.entrada, parseInt(qualidade));
    } catch (e) {
        s.resultado = { sucesso: false, erro: String(e) };
    }
    s.carregando = false;
    render();
}

async function executarRedimensionamento() {
    const s = estado.imagem;
    const largura = document.getElementById('inLargura').value;
    const altura = document.getElementById('inAltura').value;
    const manter = document.getElementById('inManterProp').checked;
    if (!largura || !altura) return;

    s.carregando = true;
    s.resultado = null;
    render();
    try {
        await sincronizarIdiomaBackend();
        s.resultado = await window.pywebview.api.redimensionar_imagem(
            s.entrada, parseInt(largura), parseInt(altura), manter
        );
    } catch (e) {
        s.resultado = { sucesso: false, erro: String(e) };
    }
    s.carregando = false;
    render();
}

async function abrirArquivo(caminho) {
    await window.pywebview.api.abrir_arquivo(caminho);
}

async function abrirPasta(caminho) {
    await window.pywebview.api.abrir_pasta(caminho);
}

function fmtKB(bytes) {
    const value = Number(bytes || 0) / 1024;
    return new Intl.NumberFormat(idiomaAtivo === 'en' ? 'en-US' : 'pt-BR', {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1,
    }).format(value) + ' KB';
}

function render() {
    document.getElementById('conteudo').innerHTML =
        abaAtiva === 'arquivo' ? renderTela('arquivo') : renderTela('imagem');
}

function renderTela(aba) {
    const s = estado[aba];
    const outraAba = aba === 'arquivo' ? 'imagem' : 'arquivo';
    let html = '';

    html += `<div class="passo">
        <div class="passo-titulo"><span class="passo-num">1</span> ${t('input')}</div>`;

    if (!s.entrada) {
        html += `<button class="btn-entrada" onclick="selecionarEntrada('${aba}')">
            ${aba === 'arquivo' ? t('selectFile') : t('selectImage')}
        </button>`;
    } else {
        const ext = extensao(s.entrada);
        html += `<div class="arquivo-info">
            <div>
                <div class="arquivo-info-nome">${escapeHtml(nomeArquivo(s.entrada))}</div>
                <div class="arquivo-info-meta">.${escapeHtml(ext.toUpperCase())}${s.info && !s.info.erro ? ' · ' + escapeHtml(s.info.tamanho_formatado) : ''}</div>
            </div>
            <button class="btn-trocar" onclick="selecionarEntrada('${aba}')">${t('change')}</button>
        </div>`;

        const outroMapaTemExt = outraAba === 'imagem' ? FORMATOS_IMAGEM.includes(ext) : !!MAPA_ARQUIVO[ext];
        const abaMapaTemExt = aba === 'imagem' ? FORMATOS_IMAGEM.includes(ext) : !!MAPA_ARQUIVO[normalizaExt(ext)];
        if (!abaMapaTemExt && outroMapaTemExt) {
            const frase = outraAba === 'imagem' ? t('looksLikeImage') : t('looksLikeFile');
            const link = outraAba === 'imagem' ? t('switchImages') : t('switchFiles');
            html += `<div class="sugestao-troca">
                ${frase}
                <a onclick="trocarComEntrada('${outraAba}', estado['${aba}'].entrada, estado['${aba}'].info)">${link}</a>
            </div>`;
        }
    }
    html += `</div>`;

    html += `<div class="passo ${!s.entrada ? 'desabilitado' : ''}">
        <div class="passo-titulo"><span class="passo-num">2</span> ${t('output')}</div>
        ${aba === 'arquivo' ? renderSaidaArquivo(s) : renderSaidaImagem(s)}
    </div>`;

    if (s.carregando) {
        html += `<div class="carregando">${t('processing')}</div>`;
    }

    if (s.resultado) {
        const r = s.resultado;
        if (r.sucesso) {
            const reduction = r.reducao_percentual !== undefined
                ? ` · ${escapeHtml(r.reducao_percentual)}% ${t('reduction')}`
                : '';
            const safePath = String(r.arquivo).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            html += `<div class="resultado">
                <div class="resultado-titulo">${t('conversionComplete')}</div>
                <div class="resultado-detalhe">${escapeHtml(nomeArquivo(r.arquivo))}${r.tamanho ? ' · ' + fmtKB(r.tamanho) : ''}${reduction}</div>
                <div class="resultado-acoes">
                    <button class="btn-mini principal" onclick="abrirArquivo('${safePath}')">${t('openFile')}</button>
                    <button class="btn-mini" onclick="abrirPasta('${safePath}')">${t('openFolder')}</button>
                    <button class="btn-mini" onclick="resetar('${aba}')">${t('newConversion')}</button>
                </div>
            </div>`;
        } else {
            html += `<div class="resultado erro">
                <div class="resultado-titulo">${t('error')}</div>
                <div class="resultado-detalhe">${escapeHtml(r.erro || t('unknownError'))}</div>
                <div class="resultado-acoes">
                    <button class="btn-mini" onclick="resetar('${aba}')">${t('tryAgain')}</button>
                </div>
            </div>`;
        }
    }

    return html;
}

function renderSaidaArquivo(s) {
    if (!s.entrada) return `<div class="placeholder-saida">${t('selectInputFileFirst')}</div>`;
    const ext = extensao(s.entrada);
    const destinos = MAPA_ARQUIVO[normalizaExt(ext)];
    if (!destinos) return `<div class="placeholder-saida">${t('formatNotSupported', escapeHtml(ext))}</div>`;
    return `<div class="chips">
        ${destinos.map(d => `<button class="chip" onclick="executarConversaoArquivo('${d}')">→ ${d.toUpperCase()}</button>`).join('')}
    </div>`;
}

function renderSaidaImagem(s) {
    if (!s.entrada) return `<div class="placeholder-saida">${t('selectInputImageFirst')}</div>`;
    const ext = extensao(s.entrada);
    if (!FORMATOS_IMAGEM.includes(ext)) return `<div class="placeholder-saida">${t('formatNotSupported', escapeHtml(ext))}</div>`;

    let html = `<div class="chips">`;
    FORMATOS_IMAGEM.filter(f => f !== ext).forEach(f => {
        html += `<button class="chip" onclick="executarConversaoImagem('${f}')">→ ${f.toUpperCase()}</button>`;
    });
    html += `<button class="chip secundario ${s.acao === 'comprimir' ? 'ativo' : ''}" onclick="abrirAcaoImagem('comprimir')">${t('compress')}</button>`;
    html += `<button class="chip secundario ${s.acao === 'redimensionar' ? 'ativo' : ''}" onclick="abrirAcaoImagem('redimensionar')">${t('resize')}</button>`;
    html += `</div>`;

    if (s.acao === 'comprimir') {
        html += `<div class="painel-param">
            <div class="campo">
                <label>${t('quality')}: <span id="qualidadeValor">85</span></label>
                <input type="range" id="inQualidade" min="1" max="100" value="85"
                    oninput="document.getElementById('qualidadeValor').textContent = this.value">
            </div>
            <button class="btn-executar" onclick="executarCompressao()">${t('compressImage')}</button>
        </div>`;
    } else if (s.acao === 'redimensionar') {
        html += `<div class="painel-param">
            <div class="campo-row">
                <div class="campo"><label>${t('width')}</label><input type="number" id="inLargura" min="1" placeholder="${t('exampleWidth')}"></div>
                <div class="campo"><label>${t('height')}</label><input type="number" id="inAltura" min="1" placeholder="${t('exampleHeight')}"></div>
            </div>
            <div class="checkbox-row"><input type="checkbox" id="inManterProp" checked> <label for="inManterProp">${t('keepAspect')}</label></div>
            <button class="btn-executar" onclick="executarRedimensionamento()">${t('resizeImage')}</button>
        </div>`;
    }
    return html;
}

function abrirAcaoImagem(acao) {
    estado.imagem.acao = estado.imagem.acao === acao ? null : acao;
    render();
}

function construirPainelConversoes() {
    const aliases = new Set(['htm', 'yml']);
    const linhasArquivo = Object.entries(MAPA_ARQUIVO)
        .filter(([origem]) => !aliases.has(origem))
        .map(([origem, destinos]) =>
            `<div class="linha-conversao"><b>${origem.toUpperCase()}</b> → ${destinos.map(d => d.toUpperCase()).join(', ')}</div>`
        ).join('');

    const linhaImagem = `<div class="linha-conversao"><b>${FORMATOS_IMAGEM.map(f => f.toUpperCase()).join(' / ')}</b> → ${t('imageConversions')}</div>`;

    return `
        <div class="grupo-conversoes"><h4>${t('documentsData')}</h4>${linhasArquivo}</div>
        <div class="grupo-conversoes"><h4>${t('imagesGroup')}</h4>${linhaImagem}</div>
    `;
}

function toggleConversoes() {
    const painel = document.getElementById('painelConversoes');
    const aberto = painel.classList.toggle('oculto') === false;
    document.getElementById('linkConversoes').textContent = aberto ? t('hideConversions') : t('showConversions');
}

document.getElementById('modalConfig').addEventListener('click', event => {
    if (event.target.id === 'modalConfig') fecharConfiguracoes();
});

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') fecharConfiguracoes();
});

window.addEventListener('pywebviewready', carregarIdiomaBackend);
aplicarIdioma();
</script>
</body>
</html>
